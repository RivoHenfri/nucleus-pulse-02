name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm install rather than npm ci: package-lock.json is not committed here
      # yet. Put it in and this becomes `npm ci` with `cache: npm`, exactly as
      # PULSE 01 has it.
      - run: npm install
      - run: npm run build
      # enablement turns Pages on for the repo on the first run where the token
      # is allowed to. On a repository where Pages has never been switched on,
      # this step answers "Resource not accessible by integration" — PULSE 01
      # hit that on its first two runs too. Someone enables Pages once, in
      # Settings > Pages, with Source set to GitHub Actions; every run after
      # that is automatic.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
